<section class="course-hero" data-course="">
    <h1 data-course-title>Course Title</h1>
    <p data-course-subtitle>Course subtitle goes here</p>
</section>
<div class="course-container">
    <aside class="instructor-card">
        <img data-course-instructor-img alt="Instructor">
        <h3 data-course-instructor-name>Instructor Name</h3>
        <p data-course-instructor-title>Instructor Title</p>
    </aside>
    <article class="course-content">
        <h2>About this course</h2>
        <p data-course-section1-text>Main course description</p>
        <h2>Main topics</h2>
        <ul data-course-topics>
            <li>Topic 1</li>
            <li>Topic 2</li>
            <li>Topic 3</li>
        </ul>
        <div class="course-description-dropdown">
            <button class="description-toggle" aria-label="Toggle full course description" aria-expanded="false" type="button">
                Full Course Description
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                </svg>
            </button>
            <div class="description-content" data-catalogue-description role="region" aria-label="Full course description">Full course description goes here</div>
        </div>
        <a href="mailto:enroll@codemaster.com" class="btn-enroll">Enroll Now</a>
    </article>
</div>
