<!DOCTYPE html>
<html lang="en">
<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeMaster</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<div data-include-html="/html/templates/header.html"></div>

<main>
    <section class="login-section">
        <h1>Sign in to your account</h1>
        <form class="login-form" id="auth-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email" 
                    required
                    autocomplete="email"
                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                    title="Please enter a valid email address (e.g., user@example.com)">
                <span class="error-message" id="email-error"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required 
                        minlength="6"
                        maxlength="50"
                        autocomplete="current-password"
                        title="Password must be at least 6 characters long">
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <svg class="password-icon-hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                        </svg>
                        <svg class="password-icon-show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c.36 0 .706.032 1.044.094.658.062 1.311.189 1.947.38a13.134 13.134 0 0 1 1.585 1.081A13.134 13.134 0 0 1 14.828 8 13.134 13.134 0 0 1 11.577 11.328c-.637.191-1.289.318-1.947.38A7.011 7.011 0 0 1 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                        </svg>
                    </button>
                </div>
                <span class="error-message" id="password-error"></span>
            </div>
            <button type="submit" class="btn-login">
                <span class="btn-login__text">Login</span>
                <span class="btn-login__spinner"></span>
            </button>
            <p class="form-footer">Don't have an account? <a href="#register">Register here</a></p>
        </form>
    </section>

</main>

    <div data-include-html="/html/templates/footer.html"></div>

    <script src="/module-loader.js"></script>
</body>
</html>
