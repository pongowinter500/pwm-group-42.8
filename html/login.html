<!DOCTYPE html>
<html lang="en">
<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeMaster</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/login.css"> <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div data-include-html="html/templates/header.html"></div>

<main>
    <section class="login-section">
        <h1>Sign in to your account</h1>
        <form class="login-form" id="auth-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email" 
                    required
                    autocomplete="email"
                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                    title="Please enter a valid email address (e.g., user@example.com)">
                <span class="error-message" id="email-error"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required 
                    minlength="6"
                    maxlength="50"
                    autocomplete="current-password"
                    title="Password must be at least 6 characters long">
                <span class="error-message" id="password-error"></span>
            </div>
            <button type="submit" class="btn-login">Login</button>
            <p class="form-footer">Don't have an account? <a href="#register">Register here</a></p>
        </form>
    </section>

</main>

    <div data-include-html="html/templates/footer.html"></div>

    <script src="../module-loader.js"></script>
</body>
</html>
