<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeMaster</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/login.css"> <link rel="stylesheet" href="css/footer.css">

<body>
<header>
    <nav>
        <ul>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#catalogue">Catalogue</a></li>
            <li><a href="index.html#business">For Business</a></li>
        </ul>
        <form>
            <input type="search" name="search" placeholder="Cerca corsi...">
        </form>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>
    <section class="login-section">
        <h1>Accedi al tuo account</h1>
        <form class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Inserisci la tua email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Inserisci la tua password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
            <p class="form-footer">Non hai un account? <a href="#register">Registrati qui</a></p>
        </form>
    </section>
</main>

<footer>
