<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-title="Course Title">CodeMaster Courses</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/learnmore.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div data-include-html="header.html"></div>
<main>
    <section class="course-hero" data-accent-color="">
        <h1 data-course-title="">Course Title</h1>
        <p data-course-subtitle="">Course subtitle goes here</p>
    </section>
    <div class="course-container">
        <aside class="instructor-card">
            <img data-instructor-img="" alt="Instructor">
            <h3 data-instructor-name="">Instructor Name</h3>
            <p data-instructor-title="">Instructor Title</p>
        </aside>
        <article class="course-content">
            <h2 data-section-1-title="">Course Overview</h2>
            <p data-section-1-text="">Main course description</p>
            <h2 data-section-2-title="">Key Topics</h2>
            <ul data-topics-list="">
                <li>Topic 1</li>
                <li>Topic 2</li>
                <li>Topic 3</li>
            </ul>
            <a href="mailto:enroll@codemaster.com" class="btn-enroll">Enroll Now</a>
        </article>
    </div>
</main>
<div data-include-html="footer.html"></div>
<script src="module-loader.js"></script>
</body>
</html>
