<header>
  <nav class="site-nav" [class.menu-open]="menuOpen">
    <a routerLink="/" class="logo-link" aria-label="Go to homepage" (click)="closeMenu()">
      <img src="/assets/images/company_icon.png" alt="CodeMaster logo" class="company-logo">
      <img src="/assets/images/mobile_logo.png" alt="CodeMaster logo" class="company-logo company-logo--mobile">
    </a>

    <button
      type="button"
      class="search-toggle"
      [class.active]="searchOpen"
      aria-label="Toggle search"
      aria-controls="mobile-search"
      [attr.aria-expanded]="searchOpen"
      (click)="toggleSearch()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
      </svg>
    </button>

    <button
      type="button"
      class="menu-toggle"
      aria-label="Open menu"
      aria-controls="primary-menu"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <form id="mobile-search" class="mobile-search-form" [class.active]="searchOpen" role="search">
      <label for="mobile-search-input" class="sr-only">Search courses</label>
      <input id="mobile-search-input" type="search" name="search" placeholder="Search courses...">
    </form>

    <div id="primary-menu" class="nav-menu">
      <ul class="nav-links">
        <li><a routerLink="/about" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">About</a></li>
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Catalogue</a></li>
        @if ((userRole$ | async) === 'student') {
          <li><a routerLink="/my-courses" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">My Courses</a></li>
        }
        <li><a routerLink="/business" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">For Business</a></li>
      </ul>
      <form class="nav-search" role="search">
        <label for="course-search-input" class="sr-only">Search courses</label>
        <input id="course-search-input" type="search" name="search" placeholder="Search courses...">
      </form>
      <div class="nav-auth">
        @if (!(isAuthenticated$ | async)) {
          <a routerLink="/login" class="nav-auth-link" (click)="closeMenu()">Login</a>
        }
        @if ((isAuthenticated$ | async)) {
          <div class="user-menu" [class.open]="userMenuOpen">
            <button type="button" class="user-avatar" (click)="toggleUserMenu()" [attr.aria-expanded]="userMenuOpen" aria-label="User menu">
              {{ getInitials(currentUser$ | async) }}
            </button>
            @if (userMenuOpen) {
              <div class="dropdown-menu">
                <p class="user-name">{{ currentUser$ | async }}</p>
                <button type="button" class="logout-btn" (click)="logout()">Logout</button>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </nav>
</header>
