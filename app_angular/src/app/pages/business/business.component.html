<main class="business-page">
  <section class="business-hero">
    <h1>Elevate Your Team's Skills</h1>
    <p>Empower your workforce with world-class tech training. Customized solutions for companies of all sizes.</p>
    <a href="mailto:business@corsi-informatica.it" class="btn-contact">Contact Sales</a>
  </section>

  <section class="business-features">
    <h2>Why Choose Us for Enterprise Training?</h2>
    <div class="feature-grid">
      <div class="feature-card" *ngFor="let feature of features">
        <h3>{{ feature.title }}</h3>
        <p>{{ feature.description }}</p>
      </div>
    </div>
  </section>
</main>
