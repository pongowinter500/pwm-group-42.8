<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DiscoverIt - Explore & Save Your Favorite Destinations</title>
    <base href="/" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Primary Meta Tags -->
    <meta name="description" content="Discover and save your favorite destinations with FavoritesApp - a beautiful mobile app for exploring the world." />
    <meta name="keywords" content="travel, destinations, favorites, mobile app, ionic, angular" />
    <meta name="author" content="FavoritesApp" />

    <!-- Apple Meta Tags -->
    <link rel="apple-touch-icon" href="assets/icon/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FavoritesApp" />

    <!-- Android Meta Tags -->
    <meta name="theme-color" content="#6C63FF" />
    <link rel="manifest" href="manifest.json" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Ionic CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />

    <!-- App CSS -->
    <link rel="stylesheet" href="theme/variables.scss" />

    <!-- Loading Script -->
    <script async src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.esm.js"></script>
  </head>

  <body>
    <app-root></app-root>

    <!-- Ionic Core JS -->
    <script 
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script 
      nomodule 
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"
    ></script>

    <!-- Icons -->
    <script 
      type="module" 
      src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.esm.js"
    ></script>
    <script 
      nomodule 
      src="https://cdn.jsdelivr.net/npm/ionicons/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
